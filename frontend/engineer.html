<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Инженер — Дархан-Ус Суваг ХК</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>@media print { .sidebar, #menu-toggle, .sidebar-overlay { display:none!important; } .main-content { margin-left:0!important; } }</style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-scrollable">
        <div class="sidebar-user-card">
          <p class="user-label">Хэрэглэгч</p>
          <p class="user-fullname" id="sidebar-username">…</p>
          <p class="user-username" id="sidebar-role">…</p>
        </div>
        <nav class="sidebar-nav">
          <a href="/engineer.html" class="nav-item active">Төлөвлөгөөт ажил</a>
          <a href="/stations-internal.html" class="nav-item">Ус түгээх байрууд</a>
          <a href="/reports.html" class="nav-item">Тайлан</a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn-sidebar-logout">Гарах</button>
      </div>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <button id="menu-toggle" class="menu-toggle">☰ Цэс</button>
        <span class="topbar-title">Төлөвлөгөөт ажил</span>
      </div>

      <div class="app-page">



        <!-- Workload -->
        <div class="card section-stack">
          <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate-400);margin:0 0 10px">Бригадын ачаалал</p>
          <div id="workload-grid" class="workload-grid"></div>
        </div>

        <!-- Tasks -->
        <div class="card section-stack">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate-400);margin:0">
              Төлөвлөгөөт ажлууд
              <span id="tasks-count" style="display:none;margin-left:6px;background:var(--brand-600);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px"></span>
            </p>
            <button class="btn btn-primary btn-sm" id="btn-new-task">+ Ажил нэмэх</button>
          </div>
          <div id="tasks-list"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Task create modal -->
  <div id="task-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Төлөвлөгөөт ажил нэмэх</h2>
        <button class="modal-close" data-close-modal>✕</button>
      </div>
      <div class="modal-body">
        <form id="task-form" class="field-grid">
          <div class="field">
            <label>Ус түгээх байр</label>
            <input id="task-station" type="text" class="input" list="task-station-list" placeholder="Код эсвэл байршлаар хайх…" autocomplete="off" required>
            <input id="task-station-id" type="hidden">
            <datalist id="task-station-list"></datalist>
          </div>
          <div class="field-row-2">
            <div class="field">
              <label>Алба</label>
              <select id="task-dept" class="select" required>
                <option value="">Алба сонгох</option>
              </select>
            </div>
            <div class="field">
              <label>Бригад</label>
              <select id="task-team" class="select" required>
                <option value="">Бригад сонгох</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>Огноо</label>
            <input id="task-date" type="date" class="input" required>
          </div>
          <div class="field">
            <label>Ажлын тайлбар</label>
            <textarea id="task-desc" class="textarea" rows="3" placeholder="Хийх ажлын дэлгэрэнгүй тайлбар…" required></textarea>
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button type="button" class="btn btn-ghost" data-close-modal>Болих</button>
            <button type="submit" class="btn btn-primary">Хуваарилах</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Team detail modal -->
  <div id="tdm-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="tdm-title" style="margin:0"></h2>
          <p id="tdm-leader" style="font-size:13px;color:var(--slate-500);margin:2px 0 0"></p>
        </div>
        <button class="modal-close" id="tdm-close">✕</button>
      </div>
      <div class="modal-body" id="tdm-body" style="display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto"></div>
    </div>
  </div>

  <script type="module" src="/assets/js/pages/engineer.js"></script>
</body>
</html>
