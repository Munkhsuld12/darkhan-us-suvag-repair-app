<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нууц үг сэргээх — Дархан-Ус Суваг ХК</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-hero" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
  <div style="width:100%;max-width:420px">
    <div class="card" style="padding:32px 28px 24px">
      <div style="margin-bottom:24px">
        <p style="font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate-500);margin-bottom:4px">Нууц үг сэргээх</p>
        <h2 style="font-size:1.25rem;font-weight:800;color:var(--ink-900);letter-spacing:-0.02em">Шинэ нууц үг үүсгэх</h2>
      </div>

      <div id="rp-invalid" style="display:none;text-align:center;padding:16px 0">
        <p style="color:var(--rose-600);font-weight:600;margin-bottom:8px">Холбоос хүчингүй эсвэл хугацаа дууссан байна.</p>
        <a href="/" class="btn btn-secondary btn-sm">Нүүр хуудас руу буцах</a>
      </div>

      <form id="rp-form" class="field-grid" style="display:none">
        <div class="field">
          <label for="rp-password">Шинэ нууц үг</label>
          <div style="position:relative">
            <input id="rp-password" type="password" class="input" placeholder="8-аас доошгүй тэмдэгт" required minlength="8" autocomplete="new-password" style="padding-right:40px">
            <button type="button" id="rp-toggle" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--slate-400);padding:0;line-height:1">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="rp-confirm">Шинэ нууц үг (давтан)</label>
          <input id="rp-confirm" type="password" class="input" placeholder="Шинэ нууц үгээ дахин оруулна уу" required autocomplete="new-password">
        </div>
        <p id="rp-error" class="error-msg" style="display:none"></p>
        <button id="rp-submit" type="submit" class="btn btn-primary btn-full btn-lg">Хадгалах</button>
      </form>

      <div id="rp-success" style="display:none;text-align:center;padding:16px 0">
        <div style="font-size:48px;margin-bottom:12px">✓</div>
        <p style="color:var(--emerald-600);font-weight:600;margin-bottom:8px">Нууц үг шинэчлэгдлээ.</p>
        <a href="/" class="btn btn-primary btn-sm">Нэвтрэх хуудас руу буцах</a>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/js/pages/reset-password.js"></script>
</body>
</html>
